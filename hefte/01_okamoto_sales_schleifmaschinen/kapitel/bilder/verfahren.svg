<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 420" font-family="DejaVu Sans" font-size="13">
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z"/></marker>
<pattern id="h" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="1"/></pattern></defs>
<g stroke="#000" stroke-width="1.4" fill="none">
<rect x="2" y="2" width="226" height="205"/><rect x="232" y="2" width="226" height="205"/><rect x="462" y="2" width="226" height="205"/>
<rect x="2" y="212" width="226" height="205"/><rect x="232" y="212" width="226" height="205"/><rect x="462" y="212" width="226" height="205"/></g>
<!-- 1 Flach Umfang -->
<g stroke="#000" stroke-width="1.5"><circle cx="115" cy="80" r="45" fill="#ddd"/><circle cx="115" cy="80" r="6" fill="#000"/>
<rect x="45" y="125" width="140" height="22" fill="url(#h)"/><rect x="30" y="147" width="170" height="10" fill="#fff"/>
<line x1="60" y1="172" x2="170" y2="172" marker-end="url(#a)"/><line x1="170" y1="182" x2="60" y2="182" marker-end="url(#a)"/></g>
<text x="115" y="25" text-anchor="middle" font-weight="bold">1 Flachschleifen</text><text x="115" y="200" text-anchor="middle" font-size="11">Umfang, Tisch pendelt</text>
<!-- 2 Rotation / Stirn -->
<g stroke="#000" stroke-width="1.5"><rect x="300" y="45" width="90" height="45" fill="#ddd"/><line x1="345" y1="35" x2="345" y2="45"/>
<rect x="290" y="90" width="110" height="10" fill="#bbb"/>
<rect x="290" y="105" width="110" height="20" fill="url(#h)"/>
<ellipse cx="345" cy="150" rx="95" ry="22" fill="#fff"/>
<path d="M300,175 A60,14 0 0,0 395,175" fill="none" marker-end="url(#a)"/></g>
<text x="345" y="25" text-anchor="middle" font-weight="bold">2 Rotations-/Stirnschleifen</text><text x="345" y="200" text-anchor="middle" font-size="11">Topfscheibe, Rundtisch dreht</text>
<!-- 3 Profil -->
<g stroke="#000" stroke-width="1.5"><path d="M530,55 h110 v60 h-35 l-20,25 l-20,-25 h-35 z" fill="#ddd"/>
<path d="M515,140 h45 l20,-25 h0 l20,25 h45 v35 h-130 z" fill="url(#h)"/></g>
<text x="575" y="25" text-anchor="middle" font-weight="bold">3 Profilschleifen</text><text x="575" y="200" text-anchor="middle" font-size="11">abgerichtete Scheibenform</text>
<!-- 4 Aussenrund -->
<g stroke="#000" stroke-width="1.5"><circle cx="80" cy="310" r="52" fill="#ddd"/><circle cx="80" cy="310" r="6" fill="#000"/>
<rect x="138" y="285" width="80" height="50" fill="url(#h)"/>
<path d="M60,252 A60,60 0 0,1 120,262" fill="none" marker-end="url(#a)"/><path d="M200,280 A30,30 0 0,1 212,300" fill="none" marker-end="url(#a)"/></g>
<text x="115" y="235" text-anchor="middle" font-weight="bold">4 Außenrundschleifen</text><text x="115" y="410" text-anchor="middle" font-size="11">Welle zwischen Spitzen</text>
<!-- 5 Innenrund -->
<g stroke="#000" stroke-width="1.5"><circle cx="345" cy="315" r="60" fill="url(#h)"/><circle cx="345" cy="315" r="36" fill="#fff"/>
<circle cx="360" cy="315" r="18" fill="#ddd"/><line x1="360" y1="315" x2="430" y2="315" stroke-width="5"/></g>
<text x="345" y="235" text-anchor="middle" font-weight="bold">5 Innenrundschleifen</text><text x="345" y="410" text-anchor="middle" font-size="11">kleine Scheibe in der Bohrung</text>
<!-- 6 Spitzenlos -->
<g stroke="#000" stroke-width="1.5"><circle cx="515" cy="315" r="45" fill="#ddd"/><circle cx="645" cy="315" r="35" fill="#bbb"/>
<circle cx="580" cy="322" r="16" fill="url(#h)"/><polygon points="565,342 595,342 590,385 570,385" fill="#fff"/></g>
<text x="575" y="235" text-anchor="middle" font-weight="bold">6 Spitzenlos</text><text x="515" y="380" text-anchor="middle" font-size="10">Schleif-</text><text x="515" y="392" text-anchor="middle" font-size="10">scheibe</text>
<text x="650" y="370" text-anchor="middle" font-size="10">Regel-</text><text x="650" y="382" text-anchor="middle" font-size="10">scheibe</text>
<text x="580" y="405" text-anchor="middle" font-size="10">Auflagelineal</text>
</svg>
